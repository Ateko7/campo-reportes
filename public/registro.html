<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registra tu empresa — Campo Reportes</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="auth-logo">🌱</div>
    <h1>Crea tu cuenta</h1>
    <p class="muted">14 días de prueba gratis. Sin tarjeta.</p>
    <form id="form">
      <label>Nombre de la empresa</label>
      <input type="text" id="empresa" required placeholder="Agrícola del Valle" />
      <label>Tu nombre</label>
      <input type="text" id="nombre" required placeholder="Juan Pérez" />
      <label>Correo</label>
      <input type="email" id="email" required placeholder="tu@empresa.com" />
      <label>Contraseña</label>
      <input type="password" id="password" required placeholder="mínimo 6 caracteres" />
      <div id="err" class="auth-err" hidden></div>
      <button class="btn btn-wa btn-block" type="submit">Crear cuenta y empezar</button>
    </form>
    <p class="muted center">¿Ya tienes cuenta? <a href="/login.html">Entra aquí</a></p>
  </div>
  <script>
    const err = document.getElementById('err');
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      err.hidden = true;
      const res = await fetch('/auth/registro', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          empresa: document.getElementById('empresa').value,
          nombre: document.getElementById('nombre').value,
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        }),
      });
      const data = await res.json();
      if (res.ok) location.href = data.redirect || '/';
      else { err.textContent = data.error || 'Error al registrar'; err.hidden = false; }
    });
  </script>
</body>
</html>
